<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="busicono.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<body>

<div id="map"></div>
<div class="map-overlay"></div>

<header class="topbar">
    <a class="brand" href="index.php">
        <div class="brand-icon">
            <i class="fa-solid fa-bus-simple"></i>
        </div>
        <div>
            <strong>Viene la Micro</strong>
            <span>Mapa en tiempo real</span>
        </div>
    </a>

    <nav class="nav">
        <a href="index.php">Inicio</a>
        <a href="index.php#recorridos">Recorridos</a>
        <a href="index.php#proximo-bus">Horarios</a>
        <a class="active" href="mapa.html">Mapa</a>
    </nav>

    <div class="actions">
        <select id="filtro" onchange="cargar()" class="btn">
            <option value="">Todos los recorridos</option>
            <option value="2">Cato</option>
            <option value="1">Coihueco</option>
        </select>

        <button class="btn btn-primary" onclick="volver()">Volver</button>
    </div>
</header>

<section class="status-panel">
    <div class="eyebrow">
        <span class="pulse"></span>
        GPS Online
    </div>

    <h1>Ubicación de buses</h1>

    <p>Revisa las micros activas, filtra recorridos y sigue cada bus en el mapa.</p>

    <div class="quick-stats">
        <div class="stat">
            <strong id="totalBuses">0</strong>
            <span>Buses activos</span>
        </div>

        <div class="stat">
            <strong>3s</strong>
            <span>Actualización</span>
        </div>

        <div class="stat">
            <strong id="totalParaderos">0</strong>
            <span>Paraderos</span>
        </div>
    </div>
</section>

<button onclick="miUbicacion()" class="location-btn">
    <i class="fa-solid fa-location-crosshairs"></i>
    Mi ubicación
</button>

<div id="activeBuses" class="active-buses"></div>
<div id="mapAlerts" class="map-alerts" aria-live="polite"></div>
<div id="etaPanel" class="eta-panel" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
    zoomControl:true
}).setView([-36.606, -72.103], 14);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
}).addTo(map);

const busIcon = L.icon({
    iconUrl: 'busicono.png',
    iconSize: [48,48],
    iconAnchor: [24,24],
    popupAnchor: [0,-22]
});

const userIcon = L.divIcon({
    className:"",
    html:`<div class="user-dot"></div>`,
    iconSize:[24,24],
    iconAnchor:[12,12]
});

const paraderoIcon = L.divIcon({
    className:"",
    html:`<div class="paradero-dot"><i class="fa-solid fa-location-dot"></i></div>`,
    iconSize:[32,32],
    iconAnchor:[16,32],
    popupAnchor:[0,-28]
});

let markers = {};
let paraderoMarkers = {};
let userMarker = null;
let primeraCarga = true;
let primeraCargaParaderos = true;
let busesActivos = [];
let paraderosData = {};
let paraderoSeleccionadoId = null;

function escaparHtml(valor){
    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function distanciaKm(lat1, lng1, lat2, lng2){
    const radioTierra = 6371;
    const gradosARadianes = Math.PI / 180;
    const dLat = (lat2 - lat1) * gradosARadianes;
    const dLng = (lng2 - lng1) * gradosARadianes;
    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * gradosARadianes) *
        Math.cos(lat2 * gradosARadianes) *
        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);

    return radioTierra * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatearDistancia(km){
    if(km < 1){
        return `${Math.round(km * 1000)} m`;
    }

    return `${km.toFixed(1).replace(".", ",")} km`;
}

function obtenerLlegadaParadero(paradero){
    const busesRuta = busesActivos.filter(bus => {
        const lat = parseFloat(bus.lat);
        const lng = parseFloat(bus.lng);

        return String(bus.id_ruta) === String(paradero.id_ruta) && !isNaN(lat) && !isNaN(lng);
    });

    if(busesRuta.length === 0){
        return {
            disponible:false,
            mensaje:"No hay micros activas para esta ruta."
        };
    }

    let mejor = null;

    for(const bus of busesRuta){
        const distancia = distanciaKm(
            parseFloat(bus.lat),
            parseFloat(bus.lng),
            parseFloat(paradero.lat),
            parseFloat(paradero.lng)
        );

        if(!mejor || distancia < mejor.distancia){
            mejor = {bus, distancia};
        }
    }

    const velocidadActual = parseFloat(String(mejor.bus.velocidad ?? "").replace(",", "."));
    const usaVelocidadActual = !isNaN(velocidadActual) && velocidadActual >= 5;
    const velocidadEstimacion = usaVelocidadActual ? velocidadActual : 25;
    const minutos = Math.max(1, Math.ceil((mejor.distancia / velocidadEstimacion) * 60));

    return {
        disponible:true,
        bus:mejor.bus,
        distancia:mejor.distancia,
        minutos,
        velocidadEstimacion,
        usaVelocidadActual
    };
}

function crearResumenLlegada(paradero){
    const llegada = obtenerLlegadaParadero(paradero);

    if(!llegada.disponible){
        return `<div class="eta-empty">${escaparHtml(llegada.mensaje)}</div>`;
    }

    return `
        <div class="eta-mini">
            <strong>${llegada.minutos} min aprox.</strong>
            <span>Micro ${escaparHtml(llegada.bus.patente ?? "sin patente")} · ${formatearDistancia(llegada.distancia)}</span>
        </div>
    `;
}

function crearPopupParadero(paradero){
    const id = Number(paradero.id_paradero);

    return `
        <div class="paradero-popup">
            <strong>📍 ${escaparHtml(paradero.nombre || "Paradero")}</strong>
            <span>Ruta: ${escaparHtml(paradero.nombre_ruta || "Sin ruta")}</span>
            ${crearResumenLlegada(paradero)}
            <button type="button" class="popup-eta-btn" onclick="seleccionarParadero(${id})">
                Ver llegada
            </button>
        </div>
    `;
}

function actualizarPanelLlegada(){
    const panel = document.getElementById("etaPanel");
    if(!panel) return;

    const paradero = paraderosData[paraderoSeleccionadoId];
    if(!paradero){
        panel.classList.remove("show");
        panel.innerHTML = "";
        return;
    }

    const llegada = obtenerLlegadaParadero(paradero);

    if(!llegada.disponible){
        panel.innerHTML = `
            <button class="eta-close" onclick="cerrarLlegada()" aria-label="Cerrar llegada">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <span class="eta-label">Paradero seleccionado</span>
            <h2>${escaparHtml(paradero.nombre)}</h2>
            <p>${escaparHtml(llegada.mensaje)}</p>
        `;
    }else{
        panel.innerHTML = `
            <button class="eta-close" onclick="cerrarLlegada()" aria-label="Cerrar llegada">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <span class="eta-label">Próxima micro</span>
            <h2>${escaparHtml(paradero.nombre)}</h2>
            <div class="eta-time">${llegada.minutos} min</div>
            <div class="eta-detail">
                <span><i class="fa-solid fa-bus-simple"></i> ${escaparHtml(llegada.bus.patente ?? "Sin patente")}</span>
                <span><i class="fa-solid fa-route"></i> ${formatearDistancia(llegada.distancia)}</span>
                <span><i class="fa-solid fa-gauge-high"></i> ${Math.round(llegada.velocidadEstimacion)} km/h ${llegada.usaVelocidadActual ? "actual" : "promedio"}</span>
            </div>
        `;
    }

    panel.classList.add("show");
}

function seleccionarParadero(id){
    paraderoSeleccionadoId = String(id);
    actualizarPanelLlegada();

    if(paraderoMarkers[id]){
        paraderoMarkers[id].openPopup();
    }
}

function cerrarLlegada(){
    paraderoSeleccionadoId = null;
    actualizarPanelLlegada();
}

function refrescarPopupsParaderos(){
    for(const id in paraderoMarkers){
        if(paraderosData[id]){
            paraderoMarkers[id].setPopupContent(crearPopupParadero(paraderosData[id]));
        }
    }

    actualizarPanelLlegada();
}

function mostrarAlertaMapa(mensaje){
    const contenedor = document.getElementById("mapAlerts");
    if(!contenedor) return;

    contenedor.innerHTML = `
        <div class="map-alert">
            <i class="fa-solid fa-circle-info"></i>
            <span>${mensaje}</span>
        </div>
    `;
}

function limpiarAlertaMapa(){
    const contenedor = document.getElementById("mapAlerts");
    if(contenedor){
        contenedor.innerHTML = "";
    }
}

function volver(){
    window.location.href = "index.php";
}

function miUbicacion(){
    if(!navigator.geolocation){
        alert("GPS no disponible");
        return;
    }

    navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        map.setView([lat,lng],16);

        if(userMarker){
            userMarker.setLatLng([lat,lng]);
        }else{
            userMarker = L.marker([lat,lng], {icon:userIcon})
                .addTo(map)
                .bindPopup("📍 Tú estás aquí")
                .openPopup();
        }
    }, () => {
        alert("No se pudo obtener tu ubicación");
    });
}

async function cargar(){
    const filtro = document.getElementById("filtro")?.value;
    cargarParaderos(filtro);
    let url = "ubicacion.php";

    if(filtro){
        url += "?id_ruta=" + encodeURIComponent(filtro);
    }

    url += (url.includes("?") ? "&" : "?") + "t=" + Date.now();

    try{
        const res = await fetch(url);

        if(!res.ok){
            throw new Error("Error HTTP " + res.status);
        }

        const data = await res.json();

        let cardsHtml = "";
        let activos = 0;
        let busesVisibles = {};
        let busesActualizados = [];
        let bounds = [];

        for(let b of data){
            const id = b.id_bus;
            const lat = parseFloat(String(b.lat).replace(',', '.'));
            const lng = parseFloat(String(b.lng).replace(',', '.'));

            if(isNaN(lat) || isNaN(lng)) continue;

            activos++;
            busesVisibles[id] = true;
            busesActualizados.push({...b, lat, lng});
            bounds.push([lat,lng]);

            const patente = b.patente ?? "Sin patente";
            const dueno = b.dueno_linea ?? "Sin datos";

            if(markers[id]){
                markers[id].setLatLng([lat,lng]);
                markers[id].setPopupContent(`🚍 Bus ${patente}`);
            }else{
                markers[id] = L.marker([lat,lng], {icon:busIcon})
                    .addTo(map)
                    .bindPopup(`🚍 Bus ${patente}`);
            }

            cardsHtml += `
                <div class="bus-mini-card">
                    <div class="bus-mini-status">● BUS ACTIVO</div>
                    <div class="bus-mini-patente">🚍 ${patente}</div>
                    <div class="bus-mini-owner">${dueno}</div>
                    <button class="bus-mini-btn" onclick="map.setView([${lat},${lng}],17)">
                        Seguir bus
                    </button>
                </div>
            `;
        }

        for(const id in markers){
            if(!busesVisibles[id]){
                map.removeLayer(markers[id]);
                delete markers[id];
            }
        }

        busesActivos = busesActualizados;
        refrescarPopupsParaderos();

        document.getElementById("totalBuses").textContent = activos;

        if(cardsHtml === ""){
            cardsHtml = `
                <div class="empty-card">
                    No hay buses activos disponibles. Revisa si el conductor tiene abierto el GPS.
                </div>
            `;
        }

        document.getElementById("activeBuses").innerHTML = cardsHtml;

        if(primeraCarga && bounds.length > 0){
            map.fitBounds(bounds, {
                padding:[80,80],
                maxZoom:15
            });
            primeraCarga = false;
        }

    }catch(error){
        document.getElementById("activeBuses").innerHTML = `
            <div class="empty-card">
                No se pudo cargar <b>ubicacion.php</b>. Revisa que el archivo exista y devuelva JSON.
            </div>
        `;
        document.getElementById("totalBuses").textContent = "0";
        console.error(error);
    }
}

async function cargarParaderos(filtro = ""){
    let url = "paraderos.php";

    if(filtro){
        url += "?id_ruta=" + encodeURIComponent(filtro);
    }

    url += (url.includes("?") ? "&" : "?") + "t=" + Date.now();

    try{
        const res = await fetch(url);

        if(!res.ok){
            throw new Error("Error HTTP " + res.status);
        }

        const data = await res.json();

        if(!Array.isArray(data)){
            throw new Error(data?.error || "paraderos.php no devolvió una lista de paraderos");
        }

        const visibles = {};
        const bounds = [];
        let total = 0;

        for(const p of data){
            const id = p.id_paradero;
            const lat = parseFloat(String(p.lat).replace(',', '.'));
            const lng = parseFloat(String(p.lng).replace(',', '.'));

            if(isNaN(lat) || isNaN(lng)) continue;

            visibles[id] = true;
            total++;
            bounds.push([lat,lng]);
            paraderosData[id] = {...p, lat, lng};
            const popup = crearPopupParadero(paraderosData[id]);

            if(paraderoMarkers[id]){
                paraderoMarkers[id].setLatLng([lat,lng]);
                paraderoMarkers[id].setPopupContent(popup);
            }else{
                paraderoMarkers[id] = L.marker([lat,lng], {icon:paraderoIcon})
                    .addTo(map)
                    .bindPopup(popup)
                    .on("click", () => seleccionarParadero(id));
            }
        }

        for(const id in paraderoMarkers){
            if(!visibles[id]){
                map.removeLayer(paraderoMarkers[id]);
                delete paraderoMarkers[id];
                delete paraderosData[id];

                if(paraderoSeleccionadoId === String(id)){
                    cerrarLlegada();
                }
            }
        }

        const totalParaderos = document.getElementById("totalParaderos");
        if(totalParaderos){
            totalParaderos.textContent = total;
        }

        if(total === 0){
            mostrarAlertaMapa("No hay paraderos activos para este filtro.");
        }else{
            limpiarAlertaMapa();
        }

        if(primeraCargaParaderos && bounds.length > 0 && Object.keys(markers).length === 0){
            map.fitBounds(bounds, {
                padding:[80,80],
                maxZoom:16
            });
            primeraCargaParaderos = false;
        }
    }catch(error){
        console.error("No se pudieron cargar paraderos:", error);
        mostrarAlertaMapa("No se pudieron cargar los paraderos. Revisa paraderos.php para ver la respuesta.");
        const totalParaderos = document.getElementById("totalParaderos");
        if(totalParaderos){
            totalParaderos.textContent = "0";
        }
    }
}

cargar();
setInterval(cargar,3000);
</script>

</body>
</html>
