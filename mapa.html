<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Mapa</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

#map{
    height:100vh;
}

</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-36.606, -72.103], 14);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

const marker = L.marker([-36.606, -72.103]).addTo(map);

async function actualizar(){

    const res = await fetch("ubicacion.php");

    const data = await res.json();

    if(data){

        marker.setLatLng([data.lat, data.lng]);

        map.setView([data.lat, data.lng]);

    }

}

setInterval(actualizar, 3000);

</script>

</body>
</html>
