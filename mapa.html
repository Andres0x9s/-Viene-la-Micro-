<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Mapa - Viene La Micro</title>

<link rel="icon" type="image/png" href="busicono.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

:root{
    --bg:#020617;
    --cyan:#25f4ff;
    --cyan2:#00c8e8;
    --muted:#94a3b8;
    --border:rgba(255,255,255,.1);
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Poppins",sans-serif;
    background:var(--bg);
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
    width:100%;
    height:100%;
    filter:saturate(1.08) contrast(1.03) brightness(1.02);
}

.map-overlay{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
        linear-gradient(180deg, rgba(2,6,23,.12), transparent 35%, rgba(2,6,23,.18)),
        linear-gradient(90deg, rgba(2,6,23,.14), transparent 35%, rgba(2,6,23,.05));
}

.topbar{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 44px);
    max-width:1380px;
    z-index:50;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:26px;
    background:rgba(2,6,23,.74);
    backdrop-filter:blur(18px);
    box-shadow:0 22px 70px rgba(0,0,0,.42);
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
    text-decoration:none;
    color:white;
}

.brand-icon{
    width:46px;
    height:46px;
    display:grid;
    place-items:center;
    border-radius:16px;
    color:#020617;
    background:linear-gradient(135deg,var(--cyan),var(--cyan2));
    box-shadow:0 0 28px rgba(37,244,255,.35);
    font-size:20px;
}

.brand strong{
    display:block;
    font-size:18px;
    line-height:1;
    font-weight:900;
}

.brand span:last-child{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.nav{
    display:flex;
    gap:28px;
}

.nav a{
    color:#cbd5e1;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
    transition:.25s;
}

.nav a:hover,
.nav a.active{
    color:var(--cyan);
}

.actions{
    display:flex;
    gap:10px;
    align-items:center;
}

.btn{
    border:none;
    outline:none;
    height:44px;
    padding:0 18px;
    border-radius:999px;
    font-family:inherit;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    color:white;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
    border-color:rgba(37,244,255,.45);
    box-shadow:0 0 24px rgba(37,244,255,.18);
}

.btn-primary{
    color:#020617;
    background:linear-gradient(135deg,var(--cyan),var(--cyan2));
}

select.btn{
    appearance:none;
    min-width:210px;
    padding-right:40px;
    background:
        linear-gradient(45deg, transparent 50%, var(--cyan) 50%) calc(100% - 21px) 50%/7px 7px no-repeat,
        rgba(255,255,255,.08);
}

.status-panel{
    position:absolute;
    top:116px;
    left:22px;
    z-index:40;
    width:330px;
    padding:22px;
    border-radius:28px;
    background:rgba(2,6,23,.76);
    border:1px solid var(--border);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,0,0,.42);
    color:white;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--cyan);
    font-size:11px;
    font-weight:900;
    letter-spacing:.18em;
    text-transform:uppercase;
}

.pulse{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 16px #22c55e;
}

.status-panel h1{
    margin:12px 0 8px;
    font-size:30px;
    line-height:1.05;
}

.status-panel p{
    margin:0;
    color:#cbd5e1;
    font-size:13px;
    line-height:1.7;
}

.quick-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:18px;
}

.stat{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:14px;
}

.stat strong{
    display:block;
    font-size:20px;
    color:white;
}

.stat span{
    color:var(--muted);
    font-size:11px;
}

.location-btn{
    position:absolute;
    right:28px;
    bottom:112px;
    z-index:45;
    display:flex;
    align-items:center;
    gap:9px;
    border:none;
    border-radius:999px;
    padding:15px 20px;
    color:#020617;
    background:linear-gradient(135deg,var(--cyan),var(--cyan2));
    font-family:inherit;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 18px 45px rgba(0,0,0,.45), 0 0 30px rgba(37,244,255,.28);
}

.active-buses{
    position:absolute;
    left:22px;
    right:22px;
    bottom:20px;
    z-index:44;
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:4px;
    scrollbar-width:none;
}

.active-buses::-webkit-scrollbar{
    display:none;
}

.bus-mini-card{
    min-width:230px;
    background:rgba(2,6,23,.84);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:13px;
    color:white;
    box-shadow:0 14px 36px rgba(0,0,0,.38);
    transition:.25s;
}

.bus-mini-card:hover{
    transform:translateY(-4px);
    border-color:rgba(37,244,255,.4);
}

.bus-mini-status{
    color:#67e8f9;
    font-size:10px;
    font-weight:900;
    letter-spacing:.12em;
    margin-bottom:6px;
}

.bus-mini-patente{
    font-size:15px;
    font-weight:900;
}

.bus-mini-owner{
    color:#94a3b8;
    font-size:12px;
    margin-top:4px;
}

.bus-mini-btn{
    width:100%;
    margin-top:10px;
    border:none;
    border-radius:999px;
    padding:8px;
    background:linear-gradient(135deg,var(--cyan),var(--cyan2));
    color:#020617;
    font-weight:900;
    cursor:pointer;
}

.empty-card{
    min-width:300px;
    color:#cbd5e1;
    background:rgba(2,6,23,.82);
    border:1px dashed rgba(255,255,255,.18);
    border-radius:20px;
    padding:18px;
    font-size:13px;
}

.leaflet-control-zoom{
    margin-top:125px!important;
    margin-left:calc(100vw - 78px)!important;
}

.leaflet-control-zoom a{
    width:42px!important;
    height:42px!important;
    line-height:42px!important;
    background:rgba(2,6,23,.82)!important;
    color:var(--cyan)!important;
    border:1px solid rgba(255,255,255,.12)!important;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
    background:#020617;
    color:white;
    border:1px solid rgba(37,244,255,.35);
}

.user-dot{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#25f4ff;
    border:3px solid white;
    box-shadow:0 0 0 10px rgba(37,244,255,.18), 0 0 26px rgba(37,244,255,.8);
}

@media(max-width:950px){
    .topbar{
        top:14px;
        width:calc(100% - 28px);
        flex-wrap:wrap;
    }

    .nav{
        order:3;
        width:100%;
        overflow-x:auto;
        gap:18px;
    }

    .actions{
        width:100%;
        overflow-x:auto;
    }

    .status-panel{
        display:none;
    }

    .location-btn{
        right:16px;
        bottom:110px;
        padding:13px 16px;
        font-size:12px;
    }

    .active-buses{
        left:12px;
        right:12px;
        bottom:14px;
    }

    .bus-mini-card{
        min-width:215px;
    }

    .leaflet-control-zoom{
        margin-top:170px!important;
        margin-left:10px!important;
    }
}
</style>
</head>

<body>

<div id="map"></div>
<div class="map-overlay"></div>

<header class="topbar">
    <a class="brand" href="index.php">
        <div class="brand-icon">
            <i class="fa-solid fa-bus-simple"></i>
        </div>
        <div>
            <strong>Viene la Micro</strong>
            <span>Mapa en tiempo real</span>
        </div>
    </a>

    <nav class="nav">
        <a href="index.php">Inicio</a>
        <a href="index.php#recorridos">Recorridos</a>
        <a href="index.php#proximo-bus">Horarios</a>
        <a class="active" href="mapa.html">Mapa</a>
    </nav>

    <div class="actions">
        <select id="filtro" onchange="cargar()" class="btn">
            <option value="">Todos los recorridos</option>
            <option value="2">Cato</option>
            <option value="1">Coihueco</option>
        </select>

        <button class="btn btn-primary" onclick="volver()">Volver</button>
    </div>
</header>

<section class="status-panel">
    <div class="eyebrow">
        <span class="pulse"></span>
        GPS Online
    </div>

    <h1>Ubicación de buses</h1>

    <p>Revisa las micros activas, filtra recorridos y sigue cada bus en el mapa.</p>

    <div class="quick-stats">
        <div class="stat">
            <strong id="totalBuses">0</strong>
            <span>Buses activos</span>
        </div>

        <div class="stat">
            <strong>3s</strong>
            <span>Actualización</span>
        </div>
    </div>
</section>

<button onclick="miUbicacion()" class="location-btn">
    <i class="fa-solid fa-location-crosshairs"></i>
    Mi ubicación
</button>

<div id="activeBuses" class="active-buses"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
    zoomControl:true
}).setView([-36.606, -72.103], 14);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
}).addTo(map);

const busIcon = L.icon({
    iconUrl: 'busicono.png',
    iconSize: [48,48],
    iconAnchor: [24,24],
    popupAnchor: [0,-22]
});

const userIcon = L.divIcon({
    className:"",
    html:`<div class="user-dot"></div>`,
    iconSize:[24,24],
    iconAnchor:[12,12]
});

let markers = {};
let userMarker = null;
let primeraCarga = true;

function volver(){
    window.location.href = "index.php";
}

function miUbicacion(){
    if(!navigator.geolocation){
        alert("GPS no disponible");
        return;
    }

    navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        map.setView([lat,lng],16);

        if(userMarker){
            userMarker.setLatLng([lat,lng]);
        }else{
            userMarker = L.marker([lat,lng], {icon:userIcon})
                .addTo(map)
                .bindPopup("📍 Tú estás aquí")
                .openPopup();
        }
    }, () => {
        alert("No se pudo obtener tu ubicación");
    });
}

async function cargar(){
    const filtro = document.getElementById("filtro")?.value;
    let url = "ubicacion.php";

    if(filtro){
        url += "?id_ruta=" + encodeURIComponent(filtro);
    }

    url += (url.includes("?") ? "&" : "?") + "t=" + Date.now();

    try{
        const res = await fetch(url);

        if(!res.ok){
            throw new Error("Error HTTP " + res.status);
        }

        const data = await res.json();

        let cardsHtml = "";
        let activos = 0;
        let busesVisibles = {};
        let bounds = [];

        for(let b of data){
            const id = b.id_bus;
            const lat = parseFloat(String(b.lat).replace(',', '.'));
            const lng = parseFloat(String(b.lng).replace(',', '.'));

            if(isNaN(lat) || isNaN(lng)) continue;

            activos++;
            busesVisibles[id] = true;
            bounds.push([lat,lng]);

            const patente = b.patente ?? "Sin patente";
            const dueno = b.dueno_linea ?? "Sin datos";

            if(markers[id]){
                markers[id].setLatLng([lat,lng]);
                markers[id].setPopupContent(`🚍 Bus ${patente}`);
            }else{
                markers[id] = L.marker([lat,lng], {icon:busIcon})
                    .addTo(map)
                    .bindPopup(`🚍 Bus ${patente}`);
            }

            cardsHtml += `
                <div class="bus-mini-card">
                    <div class="bus-mini-status">● BUS ACTIVO</div>
                    <div class="bus-mini-patente">🚍 ${patente}</div>
                    <div class="bus-mini-owner">${dueno}</div>
                    <button class="bus-mini-btn" onclick="map.setView([${lat},${lng}],17)">
                        Seguir bus
                    </button>
                </div>
            `;
        }

        for(const id in markers){
            if(!busesVisibles[id]){
                map.removeLayer(markers[id]);
                delete markers[id];
            }
        }

        document.getElementById("totalBuses").textContent = activos;

        if(cardsHtml === ""){
            cardsHtml = `
                <div class="empty-card">
                    No hay buses activos disponibles. Revisa si el conductor tiene abierto el GPS.
                </div>
            `;
        }

        document.getElementById("activeBuses").innerHTML = cardsHtml;

        if(primeraCarga && bounds.length > 0){
            map.fitBounds(bounds, {
                padding:[80,80],
                maxZoom:15
            });
            primeraCarga = false;
        }

    }catch(error){
        document.getElementById("activeBuses").innerHTML = `
            <div class="empty-card">
                No se pudo cargar <b>ubicacion.php</b>. Revisa que el archivo exista y devuelva JSON.
            </div>
        `;
        document.getElementById("totalBuses").textContent = "0";
        console.error(error);
    }
}

cargar();
setInterval(cargar,3000);
</script>

</body>
</html>
